# ============================================================================
# Ambiente local completo — espelha a arquitetura de nuvem em uma máquina só.
#
#   kafka        <-> Azure Event Hubs (endpoint compatível com o protocolo Kafka)
#   pipeline     <-> Azure Databricks Job (mesmo código, mesmo comando)
#   ./data       <-> Azure Data Lake Storage Gen2 (container do lakehouse)
#
# Uso:
#   docker compose run --rm pipeline                 # batch: raw -> bronze -> silver -> gold
#   docker compose --profile streaming up            # Kafka + produtor + consumidor
#   docker compose --profile notebooks up jupyter    # notebooks em http://localhost:8888
# ============================================================================

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: alfabetizacao-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: alfabetizacao-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    profiles: ["streaming"]

  # Cria o tópico com 3 partições e retenção de 7 dias (histórico para replay).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: alfabetizacao-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
         --create --if-not-exists --topic alfabetizacao.eventos.v1
         --partitions 3 --replication-factor 1
         --config retention.ms=604800000 --config compression.type=snappy
       && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic alfabetizacao.eventos.v1"
    profiles: ["streaming"]

  # Pipeline batch: prepara a raw e roda bronze -> silver -> gold.
  pipeline:
    build: .
    container_name: alfabetizacao-pipeline
    volumes:
      - ./data:/app/data
    environment:
      FORMATO_TABELA: ${FORMATO_TABELA:-delta}
      SPARK_MASTER: local[*]
      LOG_NIVEL: INFO
    command: ["python", "-m", "src.pipeline", "--reprocessar"]

  # Produtor de eventos -> Kafka.
  produtor:
    build: .
    container_name: alfabetizacao-produtor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FONTE_STREAM: kafka
    command: ["python", "-m", "src.ingestao.produtor_eventos", "--eventos", "1200", "--intervalo", "0.08"]
    profiles: ["streaming"]

  # Consumidor Structured Streaming -> bronze/silver/gold em tempo quase real.
  consumidor:
    build: .
    container_name: alfabetizacao-consumidor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FONTE_STREAM: kafka
      FORMATO_TABELA: ${FORMATO_TABELA:-delta}
    command: ["python", "-m", "src.pipeline", "--etapas", "streaming"]
    profiles: ["streaming"]

  jupyter:
    build: .
    container_name: alfabetizacao-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    # Uma única linha: o bloco dobrado (>) do YAML, com as linhas de
    # continuação MAIS indentadas que a primeira, faz o YAML preservar as
    # quebras de linha em vez de dobrá-las em espaço — o "--allow-root"
    # acabava virando um comando novo para o shell (`sh: --allow-root: not
    # found`), e o Jupyter reiniciava em loop por rodar como root sem a flag.
    command: "sh -c \"pip install --no-cache-dir jupyter && jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''\""
    profiles: ["notebooks"]
